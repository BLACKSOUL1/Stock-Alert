# ----- Stock bot settings -----------------------------------------------------

# How often to check each product (seconds), per product. With 12 products and 60 s,
# the bot makes about 12 requests a minute. Going much faster risks an IP block.
interval_seconds: 60

# Random extra delay (0..N seconds) added to each check so it looks less robotic.
jitter_seconds: 10

# Also message you when an in-stock item sells out again?
notify_when_sold_out_again: false

# While an item stays in stock, repeat the alert every N minutes (0 = alert once only).
# Hot Wheels can sell out fast, so keep nagging until you've bought it.
repeat_alert_minutes: 4

# Warn me on Telegram if a page can't be read this many checks in a row
# (site blocking the bot, page moved, layout changed...).
warn_after_failures: 3

# Treat "pre-order" / "backorder" as in stock? (only used by generic detection, not FirstCry)
preorder_counts_as_in_stock: true

