name: Stock check

on:
  schedule:
    # Every 5 minutes (GitHub's shortest allowed interval), offset from :00 because
    # the top of the hour is when GitHub is busiest and scheduled runs are delayed most.
    - cron: "3-59/5 * * * *"
  workflow_dispatch: # lets you start a run by hand from the Actions tab (use this to test)

# Never run two checks at the same time.
concurrency:
  group: stock-check
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # needed only to delete old saved-state caches

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The runner is wiped after every run, so the bot's memory of what it already
      # alerted (state.json) is saved to, and restored from, GitHub's cache.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: stock-state-${{ github.run_id }}
          restore-keys: stock-state-

      - name: Check stock
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python stockbot.py --once

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: stock-state-${{ github.run_id }}

      # Keep only the 3 newest saved states so they don't pile up.
      - name: Delete old saved states
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --key stock-state- --sort created_at --order desc --limit 100 --json id --jq '.[3:][].id' \
            | xargs -r -n1 gh cache delete
